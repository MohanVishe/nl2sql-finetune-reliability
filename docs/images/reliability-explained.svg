<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Two ways of counting the same ten attempts">
<title>Two ways of counting the same ten attempts</title>
<text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8b93a1">Ask the same question 10 times. Two ways to count the answers.</text>

<text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b93a1">Question A</text>
<circle cx="150" cy="61" r="9" fill="#3fa06a"/><circle cx="178" cy="61" r="9" fill="#d1544f"/><circle cx="206" cy="61" r="9" fill="#d1544f"/><circle cx="234" cy="61" r="9" fill="#3fa06a"/><circle cx="262" cy="61" r="9" fill="#d1544f"/><circle cx="290" cy="61" r="9" fill="#3fa06a"/><circle cx="318" cy="61" r="9" fill="#d1544f"/><circle cx="346" cy="61" r="9" fill="#d1544f"/><circle cx="374" cy="61" r="9" fill="#3fa06a"/><circle cx="402" cy="61" r="9" fill="#d1544f"/>
<text x="432" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#3fa06a" font-weight="700">counts as SOLVED by pass@10</text>
<text x="432" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d1544f" font-weight="700">counts as FAILED by pass^10</text>

<text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b93a1">Question B</text>
<circle cx="150" cy="117" r="9" fill="#3fa06a"/><circle cx="178" cy="117" r="9" fill="#3fa06a"/><circle cx="206" cy="117" r="9" fill="#3fa06a"/><circle cx="234" cy="117" r="9" fill="#3fa06a"/><circle cx="262" cy="117" r="9" fill="#3fa06a"/><circle cx="290" cy="117" r="9" fill="#3fa06a"/><circle cx="318" cy="117" r="9" fill="#3fa06a"/><circle cx="346" cy="117" r="9" fill="#3fa06a"/><circle cx="374" cy="117" r="9" fill="#3fa06a"/><circle cx="402" cy="117" r="9" fill="#3fa06a"/>
<text x="432" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#3fa06a" font-weight="700">counts as SOLVED by pass@10</text>
<text x="432" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#3fa06a" font-weight="700">counts as SOLVED by pass^10</text>

<line x1="20" y1="158" x2="700" y2="158" stroke="#8b93a180" stroke-width="1"/>

<text x="20" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4c86e8">pass@10  —  “can it ever get this right?”</text>
<text x="20" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#8b93a1">At least one of the 10 answers is right. This is the usual benchmark score. It suits a person</text>
<text x="20" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#8b93a1">who can press “try again” and pick the answer that works.</text>

<text x="20" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e8833a">pass^10  —  “can I depend on it?”</text>
<text x="20" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#8b93a1">All 10 answers are right. This is what a product needs, where nobody checks each answer.</text>
<text x="20" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#8b93a1">The distance between the two numbers is the <tspan font-weight="700">reliability gap</tspan>: how flaky the model is.</text>
</svg>
