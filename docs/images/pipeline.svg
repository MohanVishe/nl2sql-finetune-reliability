<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="How the two models are built and measured">
<title>How the two models are built and measured</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
  </marker>
</defs>
<style>
  .box { fill: #4c86e814; stroke: #4c86e8; stroke-width: 1.5; rx: 8; }
  .boxt { fill: #e8833a14; stroke: #e8833a; stroke-width: 1.5; rx: 8; }
  .boxn { fill: #8b93a114; stroke: #8b93a1; stroke-width: 1.5; rx: 8; }
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #8b93a1; }
  .h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #8b93a1; }
</style>

<rect x="270" y="16" width="220" height="52" class="boxn"/>
<text x="380" y="38" class="h" fill="#8b93a1" text-anchor="middle">Qwen2.5-Coder-3B-Instruct</text>
<text x="380" y="56" class="s" text-anchor="middle">the same open model the baseline used</text>

<line x1="330" y1="68" x2="180" y2="104" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430" y1="68" x2="580" y2="104" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="108" width="280" height="56" class="box"/>
<text x="180" y="130" class="h" fill="#4c86e8" text-anchor="middle">left alone</text>
<text x="180" y="148" class="s" text-anchor="middle">no fine-tuning</text>

<rect x="440" y="108" width="280" height="56" class="boxt"/>
<text x="580" y="130" class="h" fill="#e8833a" text-anchor="middle">fine-tuned (QLoRA)</text>
<text x="580" y="148" class="s" text-anchor="middle">5,851 question → SQL examples</text>

<line x1="180" y1="164" x2="180" y2="196" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580" y1="164" x2="580" y2="196" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="200" width="280" height="62" class="boxn"/>
<text x="180" y="222" class="h" fill="#8b93a1" text-anchor="middle">same packaging steps</text>
<text x="180" y="240" class="s" text-anchor="middle">shrink to 4-bit, load into the server</text>
<text x="180" y="256" class="s" text-anchor="middle">identical settings for both</text>

<rect x="440" y="200" width="280" height="62" class="boxn"/>
<text x="580" y="222" class="h" fill="#8b93a1" text-anchor="middle">same packaging steps</text>
<text x="580" y="240" class="s" text-anchor="middle">shrink to 4-bit, load into the server</text>
<text x="580" y="256" class="s" text-anchor="middle">identical settings for both</text>

<line x1="180" y1="262" x2="180" y2="292" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580" y1="262" x2="580" y2="292" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="296" width="280" height="50" class="box"/>
<text x="180" y="318" class="h" fill="#4c86e8" text-anchor="middle">F0 — the “before” model</text>
<text x="180" y="336" class="s" text-anchor="middle">all 434 tensors match the baseline</text>

<rect x="440" y="296" width="280" height="50" class="boxt"/>
<text x="580" y="318" class="h" fill="#e8833a" text-anchor="middle">F1 — the “after” model</text>
<text x="580" y="336" class="s" text-anchor="middle">only the trained parts differ</text>

<line x1="180" y1="346" x2="300" y2="374" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580" y1="346" x2="460" y2="374" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="378" width="360" height="36" class="boxn"/>
<text x="380" y="401" class="h" fill="#8b93a1" text-anchor="middle">496 questions × 10 attempts each, scored by running the SQL</text>
</svg>
