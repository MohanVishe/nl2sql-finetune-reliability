[project]
name = "nl2sql-finetune-reliability"
version = "0.1.0"
description = "Does fine-tuning make an NL2SQL model more reliable, or only more capable?"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mohan Prakash Vishe" }]
keywords = ["nl2sql", "text-to-sql", "fine-tuning", "qlora", "evaluation", "reliability"]
dependencies = [
    # The harness this study measures with. Pinned to the exact commit that produced the
    # published P1 numbers, so the prompt builder, scorer and estimators cannot drift.
    "nl2sql-reliability",
]

[project.optional-dependencies]
train = [
    "torch>=2.6",
    "transformers>=4.50",
    "peft>=0.15",
    "trl>=0.20",
    "bitsandbytes>=0.45",
    "datasets>=3.0",
    "accelerate>=1.5",
    # llama.cpp's converter probes for a SentencePiece vocab before falling back to BPE,
    # and only catches FileNotFoundError -- so the module must import even though Qwen is BPE.
    "sentencepiece>=0.2",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/MohanVishe/nl2sql-finetune-reliability"

[tool.uv.sources]
nl2sql-reliability = { git = "https://github.com/MohanVishe/nl2sql-reliability", rev = "a0ea7fbff713860d2f1c44c039229b8849e5ca5d" }
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql_finetune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q"
markers = [
    "databases: requires the BIRD databases on disk",
    "gpu: requires a CUDA GPU",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
