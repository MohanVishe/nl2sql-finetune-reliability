name: ci

# Runs the checks that need no GPU, no model download and no 60 GB of databases.
# Tests that need those (token-count parity against the published logs, the contamination
# check on the real training set) skip themselves unless the matching environment variable
# points at the data -- see tests/conftest.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project from the lock file (no training extras -- CPU only here)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check scripts src tests

      - name: Test
        run: uv run python -m pytest -q -rs
